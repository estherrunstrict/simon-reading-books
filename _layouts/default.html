<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="description" content="{{ page.summary | default: site.description | escape }}">
  <meta name="theme-color" content="#fbf8f1">
  <title>{{ page.title | escape }} | {{ site.title | escape }}</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
  <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
</head>
<body>
  <a class="skip" href="#main">본문으로 건너뛰기</a>
  <header class="mast">
    <div class="mast-inner">
      <a class="brand" href="{{ '/' | relative_url }}"><span class="mark" aria-hidden="true"></span>{{ site.title | escape }}</a>
      <nav aria-label="주 메뉴">
        <a href="{{ '/' | relative_url }}#shelf"{% if page.url == '/' %} aria-current="page"{% endif %}>내 책장</a>
        <a href="{{ '/add/' | relative_url }}#recommend">추천 책</a>
        <a class="nav-cta" href="{{ '/add/' | relative_url }}"{% if page.url == '/add/' %} aria-current="page"{% endif %}>+ 책 추가</a>
      </nav>
    </div>
  </header>
  <main id="main">{{ content }}</main>
  <footer class="foot"><span>시몬이 읽고, 확인하고, 기억하는 곳.</span><span>원도와 함께하는 독서 기록</span></footer>
  <script src="{{ '/assets/readcheck.js' | relative_url }}" defer></script>
  <script src="{{ '/assets/structure.js' | relative_url }}" defer></script>
  {% if page.url == '/add/' %}<script src="{{ '/assets/add-book.js' | relative_url }}" defer></script>{% endif %}
</body>
</html>
