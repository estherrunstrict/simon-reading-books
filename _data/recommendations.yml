# 책 추가 화면의 "추천 책"에 나오는 목록이에요. 자유롭게 고치거나 더해요.
# level: 그림책, 저학년, 중학년 중 하나로 적으면 화면에서 골라 볼 수 있어요.
- title: "구름빵"
  author: "백희나"
  genre: "그림책"
  level: 그림책
  why: "구름으로 빵을 구워 먹으면 하늘을 날 수 있어요. 사진처럼 만든 그림을 구석구석 보는 재미가 있어요."
- title: "알사탕"
  author: "백희나"
  genre: "그림책"
  level: 그림책
  why: "알사탕을 먹으면 들리지 않던 마음의 소리가 들려요. 말하지 못한 마음을 이야기하기 좋아요."
- title: "강아지똥"
  author: "권정생"
  genre: "그림책"
  level: 그림책
  why: "쓸모없다고 여겨진 강아지똥이 민들레를 피워요. 나도 소중하다는 걸 느끼게 해 줘요."
- title: "엄마 마중"
  author: "이태준"
  genre: "그림책"
  level: 그림책
  why: "전차 정거장에서 엄마를 기다리는 아이의 이야기예요. 짧은 글과 그림 사이를 천천히 읽어요."
- title: "아낌없이 주는 나무"
  author: "셸 실버스타인"
  genre: "그림책"
  level: 그림책
  why: "나무와 소년이 함께 나이 들어 가요. 다 읽고 나서 생각할 거리가 많은 책이에요."
- title: "책 먹는 여우"
  author: "프란치스카 비어만"
  genre: "동화"
  level: 저학년
  why: "책을 너무 좋아해서 먹어 버리는 여우가 나와요. 책을 좋아하는 아이에게 딱 맞는 웃긴 이야기예요."
- title: "만복이네 떡집"
  author: "김리리"
  genre: "동화"
  level: 저학년
  why: "떡을 먹으면 신기한 일이 생기는 떡집이 나와요. 짧은 챕터로 나뉘어 혼자 읽기 좋아요."
- title: "짜장 짬뽕 탕수육"
  author: "김영주"
  genre: "동화"
  level: 저학년
  why: "새 학교 화장실에서 벌어지는 놀이 이야기예요. 친구 사이의 마음을 이야기해 보기 좋아요."
- title: "나쁜 어린이 표"
  author: "황선미"
  genre: "동화"
  level: 저학년
  why: "선생님의 나쁜 어린이 표 때문에 속상한 건우의 이야기예요. 억울한 마음을 함께 느껴 봐요."
- title: "프린들 주세요"
  author: "앤드루 클레먼츠"
  genre: "동화"
  level: 중학년
  why: "펜을 '프린들'이라고 부르기 시작한 아이 때문에 온 동네가 들썩여요. 말과 낱말에 관심이 생겨요."
- title: "샬롯의 거미줄"
  author: "E. B. 화이트"
  genre: "동화"
  level: 중학년
  why: "돼지 윌버를 구하려는 거미 샬롯의 우정 이야기예요. 긴 동화에 처음 도전할 때 좋아요."
- title: "마틸다"
  author: "로알드 달"
  genre: "동화"
  level: 중학년
  why: "책을 사랑하는 천재 소녀 마틸다가 못된 어른들에게 맞서요. 신나고 통쾌하게 읽혀요."
- title: "찰리와 초콜릿 공장"
  author: "로알드 달"
  genre: "동화"
  level: 중학년
  why: "황금 티켓을 얻은 찰리가 신기한 초콜릿 공장에 들어가요. 상상력이 가득한 장면이 이어져요."
- title: "마당을 나온 암탉"
  author: "황선미"
  genre: "동화"
  level: 중학년
  why: "알을 품고 싶은 암탉 잎싹이 마당을 나와 꿈을 찾아가요. 오래 기억에 남는 우리 동화예요."
- title: "긴긴밤"
  author: "루리"
  genre: "동화"
  level: 중학년
  why: "코뿔소 노든과 어린 펭귄이 바다를 찾아 긴 길을 걸어요. 그림과 글이 함께 마음을 울려요."
