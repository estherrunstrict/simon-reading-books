title: 시몬의 책 읽기
description: 시몬이 읽은 책을 모으고, 독서 확인 퀴즈로 진짜 읽었는지 확인하는 책장
url: https://simon.itdo.work
baseurl: ""
lang: ko
timezone: Asia/Seoul
markdown: kramdown
highlighter: rouge
repository: estherrunstrict/simon-reading-books
write_url: https://github.com/estherrunstrict/simon-reading-books/new/main/_books
reading_goal: 30
# 책 추가 화면의 검색용 Google Books API 키 (없어도 돼요). 공개되는 값이니
# Google Cloud에서 HTTP 리퍼러를 이 사이트 주소로 제한한 키만 넣어요.
google_books_key: ""
# 한국 책 검색용 도서관 정보나루(data4library.kr) 인증키 (없어도 돼요). 이 값도 페이지에 공개돼요.
data4library_key: ""
readcheck:
  pass_percent: 80
# Whose reading site this build is. Sophia's build adds _kids/sophia/_config.yml on top of this file
# (scripts/build_sophia.sh), which swaps this block, the data folder and the books folder.
kid:
  key: simon
  name: 시몬
  ni: 시몬이
  en: Simon
  theme: "#2747f5"
  theme_2: "#1430c4"
  glow: "#6b86ff"
  img: /assets/img/
  card_back: https://tcg.pokemon.com/assets/img/global/tcg-card-back-2x.jpg
  cards: 진짜 포켓몬 카드
  young: false
collections:
  books:
    output: true
    permalink: /reading/books/:name/
defaults:
  - scope:
      path: ""
      type: books
    values:
      layout: book
exclude:
  - README.md
  - kids-blog
  - Gemfile
  - Gemfile.lock
  - vendor
  - tests
  - scripts
  - .gitignore
  - media
  - docs
