title: 시몬의 책 읽기
description: 시몬이 읽은 책을 모으고, 독서 확인 퀴즈로 진짜 읽었는지 확인하는 책장
url: https://simon.itdo.work
baseurl: ""
lang: ko
timezone: Asia/Seoul
markdown: kramdown
highlighter: rouge
repository: estherrunstrict/simon-reading-books
write_url: https://github.com/estherrunstrict/simon-reading-books/new/main/_books
reading_goal: 30
readcheck:
  pass_percent: 80
collections:
  books:
    output: true
    permalink: /books/:name/
defaults:
  - scope:
      path: ""
      type: books
    values:
      layout: book
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - tests
  - scripts
  - .gitignore
