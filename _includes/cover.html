{% if include.book.cover %}<div class="book-cover has-image" aria-hidden="true"><img src="{{ include.book.cover | escape }}" alt="" loading="lazy" referrerpolicy="no-referrer"></div>{% else %}<div class="book-cover cover-{{ include.book.title | size | modulo: 5 }}" aria-hidden="true"><span class="cover-title">{{ include.book.title | escape }}</span><span class="cover-author">{{ include.book.author | escape }}</span></div>{% endif %}
